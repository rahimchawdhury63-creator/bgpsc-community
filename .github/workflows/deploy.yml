name: Deploy

on:
  push:
    # TEMPORARY: arena/** is listed here so the production deploy can be run
    # from this branch once. Revert to `branches: [main]` before merging.
    branches: [main, arena/**]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  preflight:
    name: Preflight (secrets present?)
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          # Fail with an explicit list instead of an opaque non-zero exit deep
          # inside a downstream job.
          missing=""
          for name in \
            SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
            SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY \
            ADMIN_EMAIL ADMIN_PASSWORD \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            CRON_SECRET VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY
          do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing"
            echo "Add them under: Settings -> Secrets and variables -> Actions -> Secrets"
            exit 1
          fi
          echo "All required secrets are present."

  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  bootstrap-admin:
    name: Bootstrap Admin
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/bootstrap-admin.mjs
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Vite inlines VITE_* at build time. A missing value would otherwise ship
      # a bundle that throws "Missing Supabase environment variables" on load
      # and renders a blank page.
      - name: Verify build-time config
        env:
          VITE_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : "${VITE_PUBLIC_SUPABASE_URL:?VITE_PUBLIC_SUPABASE_URL is empty - check the SUPABASE_PROJECT_REF secret}"
          : "${VITE_PUBLIC_SUPABASE_ANON_KEY:?VITE_PUBLIC_SUPABASE_ANON_KEY is empty - check the SUPABASE_ANON_KEY secret}"
      - run: npm run build
        env:
          VITE_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_PUBLIC_SITE_URL: https://bgpscian.bsdc.info.bd
      - run: npm run gen:types:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Deliberately does not depend on bootstrap-admin: an admin-account problem
    # should not keep the site offline.
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `functions/` at the repo root is bundled as Pages Functions.
          command: pages deploy dist --project-name=bgpsc-community --commit-dirty=true --branch=main

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      # The Worker imports @supabase/supabase-js and web-push, so wrangler needs
      # node_modules present to bundle it.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--config` selects the config file; a bare path would be read as the
          # script entrypoint instead. wrangler splits --var on the first colon,
          # so the https:// in the value is safe.
          command: deploy --config worker/wrangler.toml --var SUPABASE_URL:https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
            CRON_SECRET
            VAPID_PRIVATE_KEY
            VAPID_PUBLIC_KEY
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

  deploy-edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy notify-dispatch --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
