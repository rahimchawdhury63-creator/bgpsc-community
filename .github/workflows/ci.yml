name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fails the build for real now: src/types/database.ts is generated from the
      # migrations, so type errors are genuine drift rather than a known gap.
      - run: npm run typecheck

  types-up-to-date:
    name: Generated Types Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Catches a migration that landed without re-running `npm run gen:types`.
      - run: npm run gen:types:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  worker-bundle:
    name: Worker Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Bundles worker/index.ts and functions/ the same way the deploy does,
      # without uploading anything.
      - run: npx wrangler deploy --config worker/wrangler.toml --dry-run --outdir /tmp/worker-out
      - run: npx wrangler pages functions build functions --outdir /tmp/fn-out

  manifest-check:
    name: Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-manifests

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          ! grep -r "sk_live_\|sk_test_\|AKIA\|password\s*=\s*['\"]" src/ || exit 1
          ! grep -r "IMGBB_API_KEY.*fdbfbcfd3bc5189e50a50c574515298d" src/ || exit 1
          echo "No secrets found in source code"

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migrations are additive
        run: |
          for file in supabase/migrations/*.sql; do
            if grep -q "DROP TABLE\|DROP COLUMN\|DROP INDEX" "$file"; then
              echo "ERROR: Migration $file contains destructive operations"
              exit 1
            fi
          done
          echo "All migrations are additive"
