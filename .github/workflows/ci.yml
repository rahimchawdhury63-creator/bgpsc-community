name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    continue-on-error: true  # Temporarily allow type errors (need to generate Supabase types)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  manifest-check:
    name: Manifest Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-manifests
        continue-on-error: ${{ !hashFiles('docs/PART5_COMPLETE.md') }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          # Check for common secret patterns
          ! grep -r "sk_live_\|sk_test_\|AKIA\|password\s*=\s*['\"]" src/ || exit 1
          ! grep -r "IMGBB_API_KEY.*fdbfbcfd3bc5189e50a50c574515298d" src/ || exit 1
          echo "No secrets found in source code"

  migration-lint:
    name: Migration Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migrations are additive
        run: |
          # Verify migrations only add, never drop
          for file in supabase/migrations/*.sql; do
            if grep -q "DROP TABLE\|DROP COLUMN\|DROP INDEX" "$file"; then
              echo "ERROR: Migration $file contains destructive operations"
              exit 1
            fi
          done
          echo "All migrations are additive"
